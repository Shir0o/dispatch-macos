name: Release

# Two ways to release:
#
# 1. Automated (recommended): merge the release PR that Release Please opens on
#    main. That run creates the tag and GitHub Release, then builds and attaches
#    the DMG in the same workflow run.
# 2. Manual: push a semantic-version tag (`git push origin v1.0.1`) or run this
#    workflow from the Actions tab with a version number.
#
# Release Please follows Conventional Commits: `fix:` -> patch, `feat:` -> minor,
# `feat!:` / `BREAKING CHANGE:` -> major.
#
# Optional repository secrets enable Developer ID signing + notarization:
#   MACOS_CERTIFICATE           base64 of a .p12 "Developer ID Application" certificate
#   MACOS_CERTIFICATE_PASSWORD  password for the .p12
#   KEYCHAIN_PASSWORD           any random password for the temporary CI keychain
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID
#   APPLE_TEAM_ID               Apple Developer Team ID
#
# Without those secrets the DMG is ad-hoc signed and users must clear the
# quarantine attribute on first launch (documented in the release notes).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 1.0.1)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Build and publish DMG
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_PLEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ "${RELEASE_PLEASE_CREATED}" = "true" ] && [ -n "${RELEASE_PLEASE_TAG}" ]; then
            # Release Please just created this tag and GitHub Release.
            TAG="${RELEASE_PLEASE_TAG}"
            SOURCE="release-please"
          elif [ "${EVENT_NAME}" = "push" ] && [[ "${REF_NAME}" == v* ]]; then
            TAG="${REF_NAME}"
            SOURCE="tag"
          else
            TAG="v${INPUT_VERSION#v}"
            SOURCE="dispatch"
          fi

          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Expected semver such as 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi

          # Any pre-release suffix (1.2.3-beta.1, 1.2.3-rc.2) is published as a pre-release.
          PRERELEASE="false"
          if [[ "${VERSION}" == *-* || "${VERSION}" == *+* ]]; then
            PRERELEASE="true"
          fi
          if [ "${SOURCE}" = "dispatch" ] && [ "${INPUT_PRERELEASE:-false}" = "true" ]; then
            PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "source=${SOURCE}" >> "${GITHUB_OUTPUT}"
          echo "Preparing ${TAG} (version ${VERSION}, prerelease ${PRERELEASE}, source ${SOURCE})"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-dispatch-ci}"
          SIGNING_KEYCHAIN="${RUNNER_TEMP}/dispatch-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"

          echo -n "${MACOS_CERTIFICATE}" | base64 --decode -o "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${SIGNING_KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${SIGNING_KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${SIGNING_KEYCHAIN}"
          security import "${CERT_PATH}" -k "${SIGNING_KEYCHAIN}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${SIGNING_KEYCHAIN}" >/dev/null

          # Keep the system keychains in the search list, with ours first.
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "${SIGNING_KEYCHAIN}" ${EXISTING_KEYCHAINS}

          IDENTITY="$(security find-identity -v -p codesigning "${SIGNING_KEYCHAIN}" \
            | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi

          rm -f "${CERT_PATH}"
          echo "identity=${IDENTITY}" >> "${GITHUB_OUTPUT}"
          echo "Signing identity: ${IDENTITY}"

      - name: Warn about missing notarization credentials
        if: env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDENTIALS != 'true'
        run: |
          echo "::warning::Developer ID signing is configured but notarization secrets are missing. The DMG will not be notarized."

      - name: Run test suite
        run: swift test --no-parallel

      - name: Build, bundle, and sign the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        run: ./scripts/package-app.sh

      - name: Notarize and staple the app
        if: env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # notarytool accepts archives, not bare bundles.
          ditto -c -k --keepParent build/Dispatch.app build/Dispatch.zip
          xcrun notarytool submit build/Dispatch.zip \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          rm -f build/Dispatch.zip

          # Staple the ticket to the bundle so the installed app validates offline.
          xcrun stapler staple build/Dispatch.app
          xcrun stapler validate build/Dispatch.app
          codesign --verify --deep --strict build/Dispatch.app

      - name: Create DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG_PATH="build/Dispatch-${VERSION}.dmg"
          ./scripts/create-dmg.sh build/Dispatch.app "${DMG_PATH}"
          echo "path=${DMG_PATH}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${DMG_PATH}")" >> "${GITHUB_OUTPUT}"

      - name: Notarize and staple the DMG
        if: env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl -a -t open --context context:primary-signature -v "${DMG_PATH}"

      - name: Verify DMG contents
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "${MOUNT_DIR}" -quiet 2>/dev/null || true
            rmdir "${MOUNT_DIR}" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "${DMG_PATH}" -nobrowse -readonly -mountpoint "${MOUNT_DIR}" >/dev/null

          APP="${MOUNT_DIR}/Dispatch.app"
          test -x "${APP}/Contents/MacOS/Dispatch"
          test -L "${MOUNT_DIR}/Applications"

          codesign --verify --deep --strict "${APP}"

          BUILT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")"
          if [ "${BUILT_VERSION}" != "${VERSION}" ]; then
            echo "::error::Bundled version ${BUILT_VERSION} does not match release version ${VERSION}."
            exit 1
          fi

          ARCHS="$(lipo -archs "${APP}/Contents/MacOS/Dispatch")"
          echo "Bundled architectures: ${ARCHS}"
          case "${ARCHS}" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *)
              echo "::error::Expected a universal binary, got: ${ARCHS}"
              exit 1
              ;;
          esac

          echo "DMG verification passed."

      - name: Generate checksum
        id: checksum
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          SHA256="$(shasum -a 256 "${DMG_PATH}" | awk '{print $1}')"
          printf '%s  %s\n' "${SHA256}" "$(basename "${DMG_PATH}")" > "${DMG_PATH}.sha256"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          cat "${DMG_PATH}.sha256"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG_NAME: ${{ steps.dmg.outputs.name }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          SIGNED_AND_NOTARIZED: ${{ env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true' }}
          SIGNED_ONLY: ${{ env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDENTIALS != 'true' }}
        run: |
          set -euo pipefail

          INSTALL_NOTES="${RUNNER_TEMP}/install-notes.md"
          FULL_NOTES="${RUNNER_TEMP}/release-notes.md"

          {
            echo "### Installation"
            echo ""
            echo "1. Download \`${DMG_NAME}\` below."
            echo "2. Open the disk image and drag **Dispatch** into **Applications**."
            echo "3. Launch Dispatch from Applications."
            echo ""
            echo "Requires macOS 14 (Sonoma) or newer. Universal build: Apple silicon and Intel."
            echo ""
            if [ "${SIGNED_AND_NOTARIZED}" = "true" ]; then
              echo "This build is signed with a Developer ID certificate and notarized by Apple."
            else
              if [ "${SIGNED_ONLY}" = "true" ]; then
                echo "This build is signed with a Developer ID certificate but has **not** been notarized."
              else
                echo "This build is **ad-hoc signed** and **not notarized**."
              fi
              echo ""
              echo "On first launch, macOS Gatekeeper may block Dispatch. Either right-click the app and choose **Open**, or clear the quarantine flag:"
              echo ""
              echo '```bash'
              echo "xattr -dr com.apple.quarantine /Applications/Dispatch.app"
              echo '```'
            fi
            echo ""
            echo "### Verify the download"
            echo ""
            echo '```bash'
            echo "shasum -a 256 -c ${DMG_NAME}.sha256"
            echo '```'
            echo ""
            echo "SHA-256: \`${SHA256}\`"
          } > "${INSTALL_NOTES}"

          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          {
            echo "## Dispatch ${VERSION}"
            echo ""
            cat "${INSTALL_NOTES}"
            echo ""
            echo "### What's changed"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              echo "Initial release."
            fi
          } > "${FULL_NOTES}"

          cat "${FULL_NOTES}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dispatch-${{ steps.version.outputs.version }}
          path: |
            build/Dispatch-*.dmg
            build/Dispatch-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Release Please already created the release (with its changelog):
            # attach the artifacts and prepend install instructions once.
            echo "Release ${TAG} already exists; attaching artifacts."
            gh release upload "${TAG}" "${DMG_PATH}" "${DMG_PATH}.sha256" --clobber

            EXISTING_BODY="${RUNNER_TEMP}/existing-body.md"
            gh release view "${TAG}" --json body -q .body > "${EXISTING_BODY}"
            if ! grep -q "### Installation" "${EXISTING_BODY}"; then
              MERGED_NOTES="${RUNNER_TEMP}/merged-notes.md"
              {
                cat "${RUNNER_TEMP}/install-notes.md"
                echo ""
                cat "${EXISTING_BODY}"
              } > "${MERGED_NOTES}"
              gh release edit "${TAG}" --notes-file "${MERGED_NOTES}"
            fi
          else
            ARGS=(--title "Dispatch ${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md")
            if [ "${PRERELEASE}" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            # On manual dispatch the tag may not exist yet: create it at this commit.
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && \
               ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              ARGS+=(--target "${GITHUB_SHA}")
            fi
            gh release create "${TAG}" \
              "${DMG_PATH}" \
              "${DMG_PATH}.sha256" \
              "${ARGS[@]}"
          fi

          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Write workflow summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE: ${{ steps.version.outputs.source }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          SIGNED_AND_NOTARIZED: ${{ env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_CREDENTIALS == 'true' }}
        run: |
          {
            echo "### Dispatch ${VERSION:-unknown}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${TAG:-n/a}\` |"
            echo "| Trigger | ${SOURCE:-n/a} |"
            if [ -n "${DMG_PATH}" ] && [ -f "${DMG_PATH}" ]; then
              echo "| DMG | \`${DMG_PATH}\` ($(du -h "${DMG_PATH}" | cut -f1)) |"
            fi
            echo "| SHA-256 | \`${SHA256:-n/a}\` |"
            echo "| Notarized | ${SIGNED_AND_NOTARIZED} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean up signing keychain
        if: always() && env.HAS_SIGNING_CERT == 'true'
        run: security delete-keychain "${RUNNER_TEMP}/dispatch-signing.keychain-db" || true
